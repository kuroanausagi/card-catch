<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抽選詳細 - Card Catch</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="card-catch">

    <header class="card-catch-header">
        <h1>Card Catch</h1>
        <p>抽選情報をまとめて管理</p>
    </header>

    <h2>抽選詳細</h2>

    <div class="lottery-detail-card">

        <p>
            <strong>店舗名</strong><br>
            <span id="shopName"></span>
        </p>

        <p>
            <strong>商品名</strong><br>
            <span id="productName"></span>
        </p>

        <p>
            <strong>応募締切</strong><br>
            <span id="deadline"></span>
        </p>

        <p>
            <strong>状態</strong><br>
            <span id="status"></span>
        </p>

        <p>
            <strong>商品状態</strong><br>
            <span id="productCondition"></span>
        </p>

    </div>

    <a id="editLink" href="#">編集する</a>
    <button id="deleteButton" type="button">削除する</button>
    <a href="lotteries.html">一覧に戻る</a>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = Number(params.get("id"));

        let lotteries =
            JSON.parse(localStorage.getItem("lotteries")) || [];

        const lottery = lotteries.find(function (item) {
            return item.id === id;
        });

        document.getElementById("editLink").href =
            `lottery-edit.html?id=${id}`;

        if (lottery) {
            document.getElementById("shopName").textContent =
                lottery.shopName;

            document.getElementById("productName").textContent =
                lottery.productName;

            document.getElementById("deadline").textContent =
                lottery.deadline;

            document.getElementById("status").textContent =
                lottery.status;

            const conditions = [];

            if (lottery.noShrink) {
                conditions.push("シュリンクなし");
            }

            if (lottery.noPeri) {
                conditions.push("ぺりなし");
            }

            if (lottery.noBox) {
                conditions.push("箱なし");
            }

            document.getElementById("productCondition").textContent =
                conditions.length > 0
                    ? conditions.join(" / ")
                    : "特になし";
        } else {
            alert("データが見つかりません。");
            window.location.href = "lotteries.html";
        }

        document.getElementById("deleteButton")
            .addEventListener("click", function () {

                const result =
                    confirm("この抽選情報を削除しますか？");

                if (!result) {
                    return;
                }

                lotteries = lotteries.filter(function (item) {
                    return item.id !== id;
                });

                localStorage.setItem(
                    "lotteries",
                    JSON.stringify(lotteries)
                );

                window.location.href = "lotteries.html";
            });
    </script>

</body>

</html>
