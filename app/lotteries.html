<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抽選一覧 - Card Catch</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="card-catch">

    <header class="card-catch-header">
        <h1>Card Catch</h1>
        <p>抽選情報をまとめて管理</p>
    </header>

    <h2>抽選一覧</h2>

    <a href="lottery-form.html">新規登録</a>

    <div class="lottery-search">
        <label for="searchInput">検索</label>
        <input type="text" id="searchInput" placeholder="店舗名・商品名で検索">
    </div>

    <table>
        <thead>
            <tr>
                <th>店舗名</th>
                <th>商品名</th>
                <th>締切</th>
                <th>状態</th>
                <th>操作</th>
            </tr>
        </thead>

        <tbody id="lotteryList"></tbody>
    </table>

    <script>
        const lotteries =
            JSON.parse(localStorage.getItem("lotteries")) || [];

        const tbody = document.getElementById("lotteryList");
        const searchInput = document.getElementById("searchInput");

        function getStatusClass(status) {
            if (status === "未応募") {
                return "status-unapplied";
            }

            if (status === "応募済み") {
                return "status-applied";
            }

            if (status === "当選") {
                return "status-win";
            }

            if (status === "落選") {
                return "status-lose";
            }

            return "";
        }

        function renderLotteries(items) {
            tbody.innerHTML = "";

            items.forEach(function (lottery) {
                const row = document.createElement("tr");
                const statusClass = getStatusClass(lottery.status);

                row.innerHTML = `
          <td>${lottery.shopName}</td>
          <td>${lottery.productName}</td>
          <td>${lottery.deadline}</td>
          <td>
            <span class="status ${statusClass}">
              ${lottery.status}
            </span>
          </td>
          <td>
            <a href="lottery-detail.html?id=${lottery.id}">
              詳細を見る
            </a>
          </td>
        `;

                tbody.appendChild(row);
            });
        }

        searchInput.addEventListener("input", function () {
            const keyword =
                searchInput.value.trim().toLowerCase();

            const filtered = lotteries.filter(function (lottery) {
                const shop =
                    (lottery.shopName || "").toLowerCase();

                const product =
                    (lottery.productName || "").toLowerCase();

                return (
                    shop.includes(keyword) ||
                    product.includes(keyword)
                );
            });

            renderLotteries(filtered);
        });

        renderLotteries(lotteries);
    </script>

</body>

</html>
