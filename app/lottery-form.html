<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抽選登録 - Card Catch</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="card-catch">

    <header class="card-catch-header">
        <h1>Card Catch</h1>
        <p>抽選情報をまとめて管理</p>
    </header>

    <h2>抽選登録</h2>

    <form>
        <p>
            <label>店舗名</label><br>
            <input type="text">
        </p>

        <p>
            <label>商品名</label><br>
            <input type="text">
        </p>

        <p>
            <label>応募締切</label><br>
            <input type="date">
        </p>

        <p>
            <label>状態</label><br>
            <select>
                <option>未応募</option>
                <option>応募済み</option>
                <option>当選</option>
                <option>落選</option>
            </select>
        </p>

        <button type="submit">登録する</button>
        <a href="lotteries.html">一覧に戻る</a>
    </form>

</body>

</html>
